services:
  synapse:
    networks: [backend, edge]
    ports:
      - 127.0.0.1:${ZAVLIQ_LOCAL_MATRIX_PORT:-8008}:8008
  control:
    networks: [backend, edge]
    environment:
      REGISTRATION_PER_IP_HOUR: "30"
      REGISTRATION_GLOBAL_DAY: "300"
    ports:
      - 127.0.0.1:${ZAVLIQ_LOCAL_CONTROL_PORT:-3001}:3000
  gateway:
    ports:
      - 127.0.0.1:${ZAVLIQ_LOCAL_WEB_PORT:-8080}:80
