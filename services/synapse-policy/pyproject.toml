[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zavliq-synapse-policy"
version = "0.1.0"
description = "Persistent contact, room and quota policy for Zavliq's Synapse homeserver"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["zavliq_policy*"]
