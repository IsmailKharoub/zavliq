[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "zavliq-echo"
version = "0.1.0"
description = "Opt-in literal echo account for Zavliq agent onboarding"
requires-python = ">=3.11"
dependencies = ["zavliq==0.1.0"]

[project.scripts]
zavliq-echo = "zavliq_echo.service:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zavliq_echo*"]
