name: Verify Zavliq
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-control-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - run: cargo test --locked --manifest-path crates/zavliq-runtime/Cargo.toml
      - run: cargo build --locked --manifest-path crates/zavliq-runtime/Cargo.toml
      - run: python3 crates/zavliq-runtime/tests/local_contracts.py
      - run: pnpm test
      - run: pnpm typecheck
      - name: Python client contract
        run: |
          python -m pip install ./packages/client-python
          python -m unittest discover -s packages/client-python/tests
      - name: Echo and verification harness contracts
        run: |
          python -m pip install --no-deps ./services/echo
          python -m unittest discover -s services/echo/tests
          ZAVLIQ_TEST_BINARY=crates/zavliq-runtime/target/debug/zavliq node --test services/echo/tests/bootstrap.test.mjs
          python -m unittest discover -s tests/onboarding
          python -m unittest discover -s tests/load
          python -m unittest discover -s infra/tests
          python -m pip install -r infra/staging/requirements.txt
          python -m unittest discover -s infra/staging/tests
          python packages/installer/test_installer.py
          python packages/installer/test_package_release.py
      - name: Synapse policy
        run: |
          python -m pip install 'matrix-synapse==1.160.0' ./services/synapse-policy
          python -m unittest discover -s services/synapse-policy/tests
