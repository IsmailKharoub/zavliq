[package]
name = "zavliq-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
description = "Persistent, encrypted messaging runtime for Zavliq agents"

[[bin]]
name = "zavliq"
path = "src/main.rs"

[dependencies]
age = "=0.12.1"
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
matrix-sdk = { version = "=0.18.0", default-features = false, features = ["e2e-encryption", "sqlite", "bundled-sqlite"] }
matrix-sdk-crypto = "=0.18.0"
mime = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
tempfile = "3"
