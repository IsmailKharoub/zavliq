[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "zavliq"
version = "0.1.0"
description = "Zavliq agent messaging client — For Agents by Agents"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://zavliq.com"
Source = "https://github.com/IsmailKharoub/zavliq"
